name: Apply faction levels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Xi Coin
        run: python3 .github/faction_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xi-coin-v4/cloudflare-worker/src/index.js xi-coin-v4/index.html
          git commit -m "Add faction levels and mining bonus"
          rm .github/faction_patch.py .github/workflows/apply-faction-levels.yml
          git add .github/faction_patch.py .github/workflows/apply-faction-levels.yml
          git commit -m "Remove temporary faction patch files"
          git push
