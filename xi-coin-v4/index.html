<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Xi Coin</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://sad.adsgram.ai/js/sad.min.js"></script><style>body{margin:0;background:#0b0f17;color:#f5f7fb;font-family:system-ui;padding:14px 14px 90px;user-select:none}.app{max-width:560px;margin:auto}.top{display:flex;justify-content:space-between}.brand{font-size:22px;font-weight:900}.muted,.small{color:#8995a8}.small{font-size:12px}.card{background:#121925;border:1px solid #273348;border-radius:18px;padding:15px;margin:12px 0}.balance{text-align:center}.coins{font-size:38px;font-weight:900;color:#ffc62b}.coin{display:block;margin:25px auto;width:190px;height:190px;border:0;border-radius:50%;font-size:70px;background:radial-gradient(circle at 30% 25%,#fff18a,#ffc62b 50%,#d77d00);box-shadow:0 12px #965900}.coin:active{transform:translateY(8px);box-shadow:0 4px #965900}.bar{height:8px;background:#263246;border-radius:9px;overflow:hidden}.fill{height:100%;background:#ffc62b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn,input{width:100%;box-sizing:border-box;border:0;border-radius:11px;padding:12px;margin-top:8px;font-weight:800}.btn{background:linear-gradient(135deg,#ffe06a,#ff9818);color:#181207}.btn.secondary{background:#202c3e;color:#fff}.btn:disabled{opacity:.45}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0d131e;border-top:1px solid #273348;padding:8px;z-index:5}.tabsin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(7,1fr)}.tab{background:none;border:0;color:#8995a8;padding:8px 2px;font-size:11px}.tab.active{color:#fff}.page{display:none}.page.active{display:block}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.list{border-bottom:1px solid #273348;padding:12px 0}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:12px;display:none;font-weight:800;z-index:20}.toast.show{display:block}.supply{background:linear-gradient(120deg,#5b3a00,#182438);border:1px solid #d99b21;border-radius:13px;padding:10px;margin:10px 0;text-align:center}.supply strong{color:#ffd34d;font-size:19px}.supply p{margin:3px 0;font-size:12px}.page.active{animation:fadeIn .22s ease}@keyframes fadeIn{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.coin.pop{animation:coinPop .18s ease}@keyframes coinPop{50%{transform:scale(1.08) rotate(5deg)}}.tabsin{grid-template-columns:repeat(8,minmax(0,1fr));gap:1px}.tab{font-size:10px;padding:6px 0}.ranknum{color:#ffc62b;font-weight:900}</head><body><div class="app"><div class="top"><b class="brand">🪙 Xi Coin</b><span id="user" class="muted">Игрок</span></div><div class="supply">💰 <strong id="supplyLeft">10 000 000 XI</strong><p>Когда будут добыты все монеты, произойдёт чудо ✨</p></div><section id="mine" class="page active"><div class="card balance"><div class="muted">БАЛАНС</div><div class="coins" id="bal">0.000</div><div>XI · <span id="gain">0.001</span> за клик</div></div><button class="coin" id="click">Ξ</button><div class="card"><div class="row"><span>⚡ Энергия</span><b class="grow" style="text-align:right"><span id="energy">1000</span>/<span id="max">1000</span></b></div><div class="bar"><div id="fill" class="fill" style="width:100%"></div></div></div><div class="card"><div class="row"><b>🎁 Ежедневный бонус</b><span class="grow"></span><b id="streak">0/7</b></div><p class="small">Заходи каждый день: награда растёт до 2 XI. Энергия восстанавливается на 1 единицу в минуту.</p><button class="btn" id="dailyClaim">Получить бонус</button></div><div class="grid"><div class="card"><b>👆 Сила клика</b><div class="small">Уровень <span id="lvl">1</span></div><div class="small">+0.000333 XI за уровень</div><div class="small">Цена: <b id="clickCost">0.033 XI</b></div><button class="btn" id="buy">Прокачать</button></div><div class="card"><b>🔋 Энергия</b><div class="small">+500 максимум</div><div class="small">Цена: <b id="energyCost">0.050 XI</b></div><button class="btn" id="energyBuy">Прокачать</button></div></div></section><section id="earn" class="page"><div class="card balance"><h3>🎬 Смотреть рекламу</h3><p>Полностью посмотри рекламу и получи <b>+1 XI</b>.</p><div class="small">Сегодня: <span id="adcount">0</span>/20</div><button class="btn" id="ad">▶ Получить 1 XI</button></div><div class="card"><b>Почему лимит?</b><p class="small">Чтобы реклама не превращалась в бесконечную генерацию монет. Лимит: 20 наград в сутки.</p></div></section><section id="shop" class="page"><div class="card"><h3>💎 Донат-магазин</h3><div class="list"><b>⚡ Xi Power</b><div class="small">Навсегда +0.010 XI к каждому клику</div><button class="btn" data-buy="power">Купить · 150 ⭐</button></div><div class="list"><b>🔋 Energy +5000</b><div class="small">Навсегда +5000 к максимальной энергии</div><button class="btn" data-buy="energy">Купить · 80 ⭐</button></div><div class="list"><b>👑 VIP x2</b><div class="small">Заготовка VIP-товара; активация после оплаты</div><button class="btn" data-buy="boost">Купить · 300 ⭐</button></div><p class="small">Оплата цифровых товаров внутри Telegram выполняется через Telegram Stars.</p></div></section><section id="transfer" class="page"><div class="card"><h3>💸 Перевод XI</h3><input id="to" placeholder="@username"><input id="amount" type="number" step="0.001" min="1000" placeholder="Минимум 1000 XI"><button class="btn" id="send">Отправить</button></div></section><section id="ref" class="page"><div class="card balance"><h3>🎁 Рефералы</h3><p>Получи <b>1 XI</b> за каждого нового приглашённого игрока. Дополнительно — 5% от его кликов.</p><input id="refLink" readonly><button class="btn" id="copy">Скопировать ссылку</button><div class="small" style="margin-top:10px">Приглашено: <b id="refs">0</b></div></div></section><section id="miners" class="page"><div class="card"><h3>⛏️ ASIC-майнинг</h3><p class="small">Майнеры добывают XI даже когда ты не в игре. Доход накапливается максимум за 24 часа.</p><div id="minerList">Загрузка...</div><button class="btn" id="claimMining">Забрать добычу</button></div><div class="card"><h3>🛒 Магазин ASIC</h3><div class="list">ASIC Mini — 0.08 XI/час <b>· 2 500 XI</b><button class="btn" data-miner="basic">Купить</button></div><div class="list">ASIC Pro — 0.6 XI/час <b>· 15 000 XI</b><button class="btn" data-miner="pro">Купить</button></div><div class="list">ASIC Farm — 5 XI/час <b>· 100 000 XI</b><button class="btn" data-miner="farm">Купить</button></div></div></section>
<section id="social" class="page"><div class="card"><h3>🛡️ Фракции</h3><div id="myFaction">Ты пока не во фракции</div><input id="factionName" maxlength="20" placeholder="Название новой фракции"><button class="btn" id="createFaction">Создать фракцию</button><div id="factionList"></div></div><div class="card"><h3>💬 Общий чат</h3><div id="chatList" style="max-height:260px;overflow:auto"></div><input id="chatMessage" maxlength="300" placeholder="Напиши сообщение"><button class="btn" id="sendChat">Отправить</button></div></section><section id="rating" class="page"><div class="card"><h3>🏆 Рейтинг игроков</h3><div id="playerRanking">Загрузка...</div></div><div class="card"><h3>🛡️ Рейтинг фракций</h3><div id="factionRanking">Загрузка...</div></div><div class="card"><h3>🎖️ Достижения</h3><div id="achievements">Загрузка...</div></div><div class="card"><h3>📅 Ежедневные задания</h3><p class="small">Выполняй задания каждый день и забирай дополнительные XI.</p><div id="tasks">Загрузка...</div></div></section></div><div class="tabs"><div class="tabsin"><button class="tab active" data-p="mine">🪙<br>Добыча</button><button class="tab" data-p="earn">🎬<br>Заработок</button><button class="tab" data-p="shop">💎<br>Донат</button><button class="tab" data-p="transfer">💸<br>Перевод</button><button class="tab" data-p="ref">🎁<br>Реф</button><button class="tab" data-p="miners">⛏️<br>ASIC</button><button class="tab" data-p="social">💬<br>Соц.</button><button class="tab" data-p="rating">🏆<br>Рейтинг</button></div></div><div id="toast" class="toast"></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const API='https://xi-coin-db.dinosem777.workers.dev';const ADSGRAM_BLOCK_ID='57230';let user=null;let ref=new URLSearchParams(location.search).get('ref')||location.hash.replace('#ref=','')||tg?.initDataUnsafe?.start_param?.replace(/^ref_/,'')||new URLSearchParams(location.search).get('tgWebAppStartParam')?.replace(/^ref_/,'')||'';function toast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}async function api(path,body){if(API==='YOUR_BACKEND_URL')throw Error('Подключи backend');const r=await fetch(API+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'tma '+(tg?.initData||'')},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j}function render(j){user=j.user;document.getElementById('bal').textContent=Number(user.balance).toFixed(3);document.getElementById('energy').textContent=user.energy;document.getElementById('max').textContent=user.max_energy;document.getElementById('gain').textContent=((Number(user.click_power)/3)*(user.vip_multiplier||1)).toFixed(3);document.getElementById('lvl').textContent=user.level;document.getElementById('clickCost').textContent=Math.max(0.033333,(0.1*Math.pow(1.7,user.level-1))/3).toFixed(3)+' XI';document.getElementById('energyCost').textContent=Math.max(0.05,(0.15*Math.pow(1.7,user.level-1))/3).toFixed(3)+' XI';document.getElementById('fill').style.width=Math.max(0,user.energy/user.max_energy*100)+'%';document.getElementById('adcount').textContent=j.adCount||0;document.getElementById('streak').textContent=(j.dailyStreak||0)+'/7';document.getElementById('dailyClaim').disabled=!j.dailyAvailable;document.getElementById('dailyClaim').textContent=j.dailyAvailable?'🎁 Забрать ежедневный бонус':'✅ Бонус уже получен';document.getElementById('refs').textContent=j.referrals||0;document.getElementById('user').textContent=tg?.initDataUnsafe?.user?.username?'@'+tg.initDataUnsafe.user.username:'Игрок';document.getElementById('ratingList').innerHTML=(j.rating||[]).map((x,i)=>`<div class="list">${i+1}. ${x.username||'Игрок'} — ${Number(x.balance).toFixed(3)} XI</div>`).join('');document.getElementById('refLink').value='https://t.me/Xicoinbot?startapp=ref_'+user.ref_code}async function load(){try{if(!tg){toast('ОШИБКА: Telegram WebApp SDK не загружен');return}if(!tg.initData){const p=new URLSearchParams(location.search);const h=location.hash||'';toast('Диагностика: SDK есть; initData='+tg.initData.length+'; версия='+((tg.version)||'нет')+'; платформа='+((tg.platform)||'нет')+'; tgWebAppData='+(p.has('tgWebAppData')||h.includes('tgWebAppData')?'есть':'нет'));return}render(await api('/api/me'+(ref?'?ref='+encodeURIComponent(ref):'')))}catch(e){toast('Авторизация: '+e.message)}}document.getElementById('click').onclick=async()=>{const c=document.getElementById('click');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');try{render(await api('/api/click',{ref}));loadProgression()}catch(e){toast(e.message)}};document.getElementById('buy').onclick=async()=>{try{render(await api('/api/upgrade',{type:'click'}))}catch(e){toast(e.message)}};document.getElementById('energyBuy').onclick=async()=>{try{render(await api('/api/upgrade',{type:'energy'}))}catch(e){toast(e.message)}};document.getElementById('dailyClaim').onclick=async()=>{try{const j=await api('/api/daily',{});toast('🎁 Получено +'+Number(j.dailyReward).toFixed(2)+' XI');await load()}catch(e){toast(e.message)}};document.getElementById('send').onclick=async()=>{try{const j=await api('/api/transfer',{to:document.getElementById('to').value,amount:Number(document.getElementById('amount').value)});render(j);toast('✅ Перевод отправлен')}catch(e){toast(e.message)}};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('refLink').value)}catch(e){}toast('Ссылка скопирована')};document.getElementById('ad').onclick=async()=>{if(!window.Adsgram)return toast('Рекламный SDK не загрузился. Попробуй позже');try{const AdController=window.Adsgram.init({blockId:ADSGRAM_BLOCK_ID});await AdController.show();render(await api('/api/ad-reward'));toast('🎁 +1 XI')}catch(e){toast('Реклама не завершена или временно недоступна')}};document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=async()=>{try{const j=await api('/api/buy',{item:b.dataset.buy});tg?.openInvoice?tg.openInvoice(j.url,status=>{if(status==='paid'){setTimeout(load,1200);toast('✅ Покупка оплачена')}}):location.href=j.url}catch(e){toast(e.message)}});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.p).classList.add('active');if(b.dataset.p==='miners'||b.dataset.p==='social')loadEconomy();if(b.dataset.p==='rating')loadProgression()});async function loadProgression(){try{const j=await api('/api/progression');const left=Math.max(0,Number(j.supply?.max_supply||10000000)-Number(j.supply?.minted||0));document.getElementById('supplyLeft').textContent=left.toLocaleString('ru-RU',{maximumFractionDigits:3})+' XI';document.getElementById('playerRanking').innerHTML=(j.players||[]).map((x,i)=>`<div class="list"><span class="ranknum">${i+1}.</span> ${x.username?'@'+x.username:'Игрок'} <b style="float:right">${Number(x.balance).toFixed(3)} XI</b></div>`).join('')||'Пока нет игроков';document.getElementById('factionRanking').innerHTML=(j.factions||[]).map((x,i)=>`<div class="list"><span class="ranknum">${i+1}.</span> ${x.name} <span class="small">· ${x.members} игроков</span><b style="float:right">${Number(x.score).toFixed(3)} XI</b></div>`).join('')||'Фракций пока нет';document.getElementById('achievements').innerHTML=(j.achievementDefs||[]).map(a=>`<div class="list">${a.unlocked?'🏅':'🔒'} <b>${a.name}</b><div class="small">${a.description}</div></div>`).join('');const progress=Object.fromEntries((j.tasks||[]).map(t=>[t.task_key,t]));const tasks=[['clicks','Сделать 50 кликов',50,'0.5 XI'],['daily','Забрать ежедневный бонус',1,'0.25 XI'],['ads','Посмотреть рекламу',1,'0.5 XI'],['miners','Забрать добычу ASIC',1,'0.5 XI']];document.getElementById('tasks').innerHTML=tasks.map(t=>{const p=progress[t[0]]||{progress:0,claimed:0};const done=p.progress>=t[2];return `<div class="list"><b>${t[1]}</b><div class="small">${Math.min(p.progress,t[2])}/${t[2]} · награда ${t[3]}</div><button class="btn ${done&&!p.claimed?'':'secondary'}" data-task="${t[0]}" ${!done||p.claimed?'disabled':''}>${p.claimed?'Получено':done?'Забрать':'Выполняй'}</button></div>`}).join('');document.querySelectorAll('[data-task]').forEach(b=>b.onclick=async()=>{try{const r=await api('/api/task-claim',{task:b.dataset.task});toast('🎁 +'+r.reward+' XI');loadProgression();load()}catch(e){toast(e.message)}})}catch(e){toast(e.message)}}async function loadEconomy(){try{const j=await api('/api/economy');document.getElementById('minerList').innerHTML=(j.miners||[]).map(m=>'<div class="list">⛏️ '+({basic:'ASIC Mini',pro:'ASIC Pro',farm:'ASIC Farm'}[m.miner_key]||m.miner_key)+'</div>').join('')||'Пока нет майнеров';document.getElementById('myFaction').textContent=j.faction?'Твоя фракция: '+j.faction.name:'Ты пока не во фракции';document.getElementById('factionList').innerHTML=(j.factions||[]).map(f=>'<div class="list">'+f.name+' · '+f.members+' игроков <button class="btn secondary" data-join="'+f.id+'">Вступить</button></div>').join('');document.querySelectorAll('[data-join]').forEach(b=>b.onclick=async()=>{try{await api('/api/faction-join',{id:Number(b.dataset.join)});toast('Вступил во фракцию');loadEconomy()}catch(e){toast(e.message)}});document.getElementById('chatList').innerHTML=(j.chat||[]).map(m=>'<div class="list"><b>'+String(m.username||'Игрок').replace(/[&<>"]/g,'')+'</b>: '+String(m.message).replace(/[&<>"]/g,'')+'</div>').join('')||'Сообщений пока нет'}catch(e){toast(e.message)}}document.querySelectorAll('[data-miner]').forEach(b=>b.onclick=async()=>{try{await api('/api/miner-buy',{miner:b.dataset.miner});toast('ASIC куплен!');loadEconomy();load()}catch(e){toast(e.message)}});document.getElementById('claimMining').onclick=async()=>{try{const j=await api('/api/miner-claim',{});toast('Добыто '+Number(j.reward).toFixed(3)+' XI');load();loadEconomy()}catch(e){toast(e.message)}};document.getElementById('createFaction').onclick=async()=>{try{await api('/api/faction-create',{name:document.getElementById('factionName').value});toast('Фракция создана');loadEconomy()}catch(e){toast(e.message)}};document.getElementById('sendChat').onclick=async()=>{try{await api('/api/chat-send',{message:document.getElementById('chatMessage').value});document.getElementById('chatMessage').value='';loadEconomy()}catch(e){toast(e.message)}};load();</script></body></html>
