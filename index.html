<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d1d"><title>Оракул</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--gold:#e9c779;--muted:#aaa2bd;--line:#392e50}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#302044,#100d1d 60%);color:white;font:16px system-ui}main{max-width:700px;margin:auto;padding:22px 16px 40px}.hero{text-align:center;padding:24px 5px}.moon{font-size:42px}.eyebrow{color:var(--gold);letter-spacing:2px;font-size:11px;text-transform:uppercase}.hero h1{font:36px Georgia;margin:8px}.hero p,.muted,small{color:var(--muted)}.profile{background:#211b34;border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0 24px}.profile b{color:var(--gold)}h2{font:23px Georgia;margin:22px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{background:linear-gradient(145deg,#241d39,#191529);border:1px solid var(--line);border-radius:17px;padding:15px;text-align:left;color:white;min-height:137px}.ico{font-size:27px}.tile b{display:block;margin:8px 0 4px}.tile small{line-height:1.35;display:block}.price{color:var(--gold);font-size:12px;display:block;margin-top:9px}button{font:inherit;cursor:pointer}.result{display:none;white-space:pre-wrap;line-height:1.6;background:#211b34;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:15px}.muted{text-align:center;font-size:12px;margin:25px 5px}.modal{display:none;position:fixed;inset:0;background:#080611dd;align-items:end;justify-content:center;padding:12px}.sheet{background:#211b34;border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:600px}.sheet input,.sheet select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#120f20;color:white;margin:8px 0 12px}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#c79b4d,#f1d58e);color:#21172a;font-weight:700}.close{float:right;background:none;color:white;border:0;font-size:22px}@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}</style></head><body><main><header class="hero"><div class="moon">☾ ✦</div><div class="eyebrow">Твой личный проводник</div><h1>Оракул</h1><p>Таро · гороскопы · предсказания с ИИ</p></header><div class="profile">Профиль: <b id="user">Гость Telegram</b></div><h2>Выбери предсказание</h2><div class="grid">
<button class="tile" data-kind="daily" data-price="0"><span class="ico">🌙</span><b>Карта дня</b><small>Подсказка на сегодня</small><span class="price">Бесплатно</span></button>
<button class="tile" data-kind="tarot_love" data-price="25"><span class="ico">💗</span><b>Любовное Таро</b><small>Чувства и отношения</small><span class="price">25 ⭐</span></button>
<button class="tile" data-kind="tarot_future" data-price="35"><span class="ico">🔮</span><b>Три карты</b><small>Прошлое, настоящее, будущее</small><span class="price">35 ⭐</span></button>
<button class="tile" data-kind="horoscope" data-price="20"><span class="ico">♌</span><b>Гороскоп</b><small>Личный прогноз</small><span class="price">20 ⭐</span></button>
<button class="tile" data-kind="compatibility" data-price="30"><span class="ico">✨</span><b>Совместимость</b><small>Пара и отношения</small><span class="price">30 ⭐</span></button>
<button class="tile" data-kind="dream" data-price="15"><span class="ico">💭</span><b>Толкование сна</b><small>Символы и значения</small><span class="price">15 ⭐</span></button>
<button class="tile" data-kind="numerology" data-price="25"><span class="ico">🔢</span><b>Нумерология</b><small>Число жизненного пути</small><span class="price">25 ⭐</span></button>
<button class="tile" data-kind="question" data-price="50"><span class="ico">🪄</span><b>Спроси Оракула</b><small>Ответ ИИ на твой вопрос</small><span class="price">50 ⭐</span></button></div><div id="result" class="result"></div><p class="muted">Предсказания носят развлекательный характер и не гарантируют будущих событий.</p></main>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><h2 id="title">Твой запрос</h2><label id="label">Вопрос или описание</label><input id="prompt" maxlength="700" placeholder="Напиши свой вопрос"><label>Знак зодиака</label><select id="sign"><option value="">Не указывать</option><option>Овен</option><option>Телец</option><option>Близнецы</option><option>Рак</option><option>Лев</option><option>Дева</option><option>Весы</option><option>Скорпион</option><option>Стрелец</option><option>Козерог</option><option>Водолей</option><option>Рыбы</option></select><button class="primary" id="submit">Продолжить</button><p class="muted" id="price"></p></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const $=id=>document.getElementById(id);let chosen=null;const names={daily:"Карта дня",tarot_love:"Любовное Таро",tarot_future:"Расклад на три карты",horoscope:"Гороскоп",compatibility:"Совместимость",dream:"Толкование сна",numerology:"Нумерология",question:"Вопрос Оракулу"};if(tg?.initDataUnsafe?.user)$("user").textContent=tg.initDataUnsafe.user.first_name||"Пользователь";
document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{chosen={kind:b.dataset.kind,price:+b.dataset.price};$("title").textContent=names[chosen.kind];$("price").textContent=chosen.price?("Стоимость: "+chosen.price+" Telegram Stars"):"Бесплатно";$("label").textContent=chosen.kind==="dream"?"Опиши свой сон":"Вопрос или дополнительная информация";$("prompt").value="";$("modal").style.display="flex"});$("close").onclick=()=> $("modal").style.display="none";
$("submit").onclick=async()=>{if(!chosen)return;let b=$("submit");b.disabled=true;b.textContent="Подготавливаем…";try{let r=await fetch("api/create.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:chosen.kind,prompt:$("prompt").value,sign:$("sign").value,initData:tg?.initData||""})});let d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка запроса");if(d.invoiceLink){tg.openInvoice(d.invoiceLink,s=>{if(s==="paid")alert("Оплата прошла. Откройте раздел истории, чтобы получить расклад.")});$("modal").style.display="none"}else if(d.result){$("modal").style.display="none";$("result").style.display="block";$("result").textContent=d.result}else throw Error("Пустой ответ")}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent="Продолжить"}};
</script></body></html>
