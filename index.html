<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Рыбалка: Симулятор</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #1a1a2e; --panel: #16213e; --accent: #e94560; --gold: #ffd700; --green: #4ade80; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 8px; }
    h1, h2, h3 { margin: 0 0 8px 0; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: var(--panel); padding: 14px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    button { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 6px; }
    button:active { opacity: 0.85; }
    button.green { background: var(--green); }
    select, input[type="range"] { width: 100%; margin-top: 8px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .stat-box { background: rgba(255,255,255,0.08); padding: 8px; border-radius: 8px; text-align: center; font-size: 13px; }
    .stat-val { font-weight: bold; color: var(--gold); }
    #log { margin-top: 10px; line-height: 1.4; color: #c0c0c0; min-height: 120px; max-height: 240px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 8px; }
    .log-line { margin-bottom: 4px; display: block; }
    .highlight { color: var(--gold); font-weight: bold; }
    .fish-img-slot { text-align: center; margin: 10px 0; min-height: 120px; color: #555; font-style: italic; }
    /* Заглушка под фон водоёма */
    .bg-placeholder { height: 180px; background: linear-gradient(180deg, #0f172a 0%, #1a1a2e 100%); border-radius: 12px; position: relative; display: flex; align-items: center; justify-content: center; color: #333; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎣 Рыбалка: Симулятор</h1>

    <!-- Панель погоды -->
    <div class="card">
      <h3>🌦 Погода и время</h3>
      <select id="weather" onchange="updateWeather()">
        <option value="clear">Ясно (обычный клёв)</option>
        <option value="rain">Дождь (крупная рыба, реже клюёт)</option>
        <option value="wind">Ветер (заброс сложнее, рыба активнее)</option>
      </select>
      <div style="margin-top:8px; font-size:13px;">
        Бонус/штраф к шансу поимки: <span id="weather-bonus" class="highlight">0%</span>
      </div>
    </div>

    <!-- Статистика и прогресс -->
    <div class="card">
      <h3>📊 Прогресс и инвентарь</h3>
      <div class="stats-grid">
        <div class="stat-box">Опыт: <span id="xp-val" class="stat-val">0</span></div>
        <div class="stat-box">Уровень: <span id="lvl-val" class="stat-val">1</span></div>
        <div class="stat-box">Деньги: <span id="money-val" class="stat-val">0 ₽</span></div>
        <div class="stat-box">Приманки: <span id="bait-val" class="stat-val">5</span></div>
      </div>
      <div style="margin-top:10px;">
        <h4>Инвентарь снастей</h4>
        <select id="rod-select" onchange="selectRod()" style="width:100%;"></select>
        <p style="font-size:12px; color:#aaa; margin-top:6px;">Выбранная удочка влияет на дальность и шанс подсечки.</p>
      </div>
    </div>

    <!-- Фон водоёма (сюда можно вставить картинку) -->
    <div class="bg-placeholder">
      <!-- Сюда можно вставить фотореалистичный фон: река/озеро -->
      <span>Фон водоёма (замените на картинку)</span>
    </div>

    <!-- Механика заброса и подсечки -->
    <div class="card">
      <h3>🎣 Локация и заброс</h3>
      <select id="location">
        <option value="shallow">Мелководье (мелкая рыба)</option>
        <option value="deep">Глубина (крупная, сложнее)</option>
        <option value="reeds">Заросли (редкие виды, риск зацепа)</option>
      </select>

      <label style="display:block; margin-top:10px;">Сила заброса (дальность):</label>
      <input type="range" id="cast-power" min="1" max="10" value="5" oninput="updateCastPower()">
      <div style="text-align:center; font-size:12px; color:#888;">Мощность: <span id="power-display">5</span>/10</div>

      <button onclick="makeCast()">🎣 Сделать заброс</button>
      <button id="hook-btn" class="green" style="display:none;" onclick="tryHook()">⚡ ПОДСЕЧЬ СЕЙЧАС!</button>
    </div>

    <div id="log"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    // Конфигурация: удочки (прокачка)
    const rods = [
      { id: 'light', name: 'Лёгкая удочка', power: 4, castDist: 12, hookChance: 0.7, cost: 0 },
      { id: 'medium', name: 'Средняя удочка', power: 6, castDist: 18, hookChance: 0.6, cost: 500 },
      { id: 'heavy', name: 'Тяжёлая удочка', power: 8, castDist: 24, hookChance: 0.5, cost: 1500 }
    ];

    // Состояние игрока
    let state = {
      xp: 0,
      level: 1,
      money: 0,
      bait: 5,
      currentRodId: 'light'
    };

    function init() {
      populateRods();
      updateUI();
      log('🎮 Добро пожаловать в симулятор рыбалки. Выберите погоду, снасть и сделайте заброс.');
    }

    function populateRods() {
      const sel = document.getElementById('rod-select');
      sel.innerHTML = '';
      rods.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = `${r.name} (дальность ${r.castDist} м, шанс ${(r.hookChance*100).toFixed(0)}%)`;
        if (r.id === state.currentRodId) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function selectRod() {
      state.currentRodId = document.getElementById('rod-select').value;
      updateUI();
      log(`Выбрана снасть: ${getRod().name}`);
    }

    function getRod() {
      return rods.find(r => r.id === state.currentRodId);
    }

    function updateCastPower() {
      const v = document.getElementById('cast-power').value;
      document.getElementById('power-display').textContent = v;
    }

    function updateWeather() {
      const w = document.getElementById('weather').value;
      let bonus = 0;
      if (w === 'rain') bonus = -0.25; // дождь: реже, но крупнее
      if (w === 'wind') bonus = +0.15;  // ветер: сложнее заброс, но рыба активнее
      document.getElementById('weather-bonus').textContent = (bonus*100).toFixed(0) + '%';
      log(`Погода: ${w === 'clear' ? 'ясно' : w === 'rain' ? 'дождь' : 'ветер'}. Бонус/штраф: ${(bonus*100).toFixed(0)}%`);
    }

    function log(msg) {
      const el = document.getElementById('log');
      el.innerHTML += `<span class="log-line">${msg}</span>`;
      el.scrollTop = el.scrollHeight;
    }

    let castResult = null;

    function makeCast() {
      if (!castResult) {
        const loc = document.getElementById('location').value;
        const power = Number(document.getElementById('cast-power').value);
        const rod = getRod();
        const weather = document.getElementById('weather').value;

        // «Физика» заброса: дальность зависит от силы и снасти
        const baseDist = rod.castDist;
        const dist = Math.min(baseDist, Math.floor(baseDist * (power / 10)));

        castResult = { location: loc, distance: dist, tension: 0 };

        log(`🎣 Заброс на ${dist} м в зону: ${loc === 'shallow' ? 'мелководье' : loc === 'deep' ? 'глубину' : 'заросли'}. Ждите поклёвки…`);
        document.getElementById('hook-btn').style.display = 'block';
        document.getElementById('hook-btn').textContent = '⚡ ПОДСЕЧЬ СЕЙЧАС!';

        // Поклёвка через случайное время
        const biteDelay = Math.random() * 3000 + 2000;
        setTimeout(showBite, biteDelay);
      }
    }

    function showBite() {
      if (!castResult) return;
      log('⚡️ ПОКЛЁВКА! Нажмите «Подсечь» в течение 1.5 секунд!');
      const btn = document.getElementById('hook-btn');
      btn.style.background = '#f97316';

      // Авто-сброс кнопки, если не успели
      setTimeout(() => {
        if (btn.style.display !== 'none') {
          log('❌ Слишком поздно! Рыба сорвалась.');
          btn.style.display = 'none';
          castResult = null;
        }
      }, 1500);
    }

    function tryHook() {
      const btn = document.getElementById('hook-btn');
      if (!castResult || btn.style.display === 'none') return;

      const rod = getRod();
      const weather = document.getElementById('weather').value;
      const loc = castResult.location;

      // «Физика» подсечки: шанс зависит от снасти, локации, погоды и приманки
      let baseChance = rod.hookChance;
      let locPenalty = 0;
      if (loc === 'deep') locPenalty = 0.2;
      if (loc === 'reeds') locPenalty = 0.35;

      let weatherBonus = 0;
      if (weather === 'rain') weatherBonus = -0.15;
      if (weather === 'wind') weatherBonus = +0.1;

      // Использование приманки (если есть)
      let baitBonus = 0;
      if (state.bait > 0) {
        state.bait--;
        baitBonus = 0.15;
        log('✅ Использована приманка (+шанс). Приманок осталось: ' + state.bait);
      } else {
        log('⚠️ Приманки закончились — шанс ниже.');
      }

      const luck = Math.random();
      const successChance = baseChance - locPenalty + weatherBonus + baitBonus + (Math.random() * 0.1 - 0.05);

      if (luck < successChance) {
        // Поймали
        const fishName = loc === 'shallow' ? 'Плотва' : loc === 'deep' ? 'Щука' : 'Сом';
        const weight = (Math.random() * 3 + 0.5).toFixed(1);
        const xpGain = loc === 'shallow' ? 10 : loc === 'deep' ? 25 : 40;
        const moneyGain = loc === 'shallow' ? 50 : loc === 'deep' ? 150 : 300;

        state.xp += xpGain;
        state.money += moneyGain;

        log(`🎉 Поймали: <span class="highlight">${fishName}</span> (${weight} кг)! +${xpGain} XP, +${moneyGain} ₽`);

        checkLevelUp();
      } else {
        log('❌ Сорвалось! Возможно, момент был неудачным или снасть не подходит.');
      }

      btn.style.display = 'none';
      castResult = null;
      updateUI();
    }

    function checkLevelUp() {
      const xpNeeded = state.level * 100;
      if (state.xp >= xpNeeded) {
        state.level++;
        state.xp -= xpNeeded;
        log(`🏆 Новый уровень: ${state.level}! Теперь доступны более мощные снасти.`);
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('xp-val').textContent = state.xp;
      document.getElementById('lvl-val').textContent = state.level;
      document.getElementById('money-val').textContent = state.money;
      document.getElementById('bait-val').textContent = state.bait;
    }

    init();
  </script>
</body>
</html>
